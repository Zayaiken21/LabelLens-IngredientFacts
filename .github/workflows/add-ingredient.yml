name: Add suggested ingredient
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: add-ingredient
jobs:
  add:
    if: startsWith(github.event.issue.title, 'New ingredient:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: check
        name: Fact-check online and add
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python3 .github/scripts/add_ingredient.py
      - name: Publish and reply
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT: ${{ steps.check.outputs.result }}
          NUM: ${{ github.event.issue.number }}
        run: |
          if [ "$RESULT" = "added" ]; then
            git config user.name "labellens-bot"; git config user.email "bot@users.noreply.github.com"
            git add community.json; git commit -m "Add community ingredient from issue #$NUM"
            git pull --rebase origin main; git push
            gh workflow run pages.yml
            gh issue close "$NUM" --comment "Fact-checked against Wikipedia and PubMed and added to the shared glossary as neutral. It shows for everyone after the next deploy (about a minute)."
          else
            gh issue close "$NUM" --reason "not planned" --comment "Not added automatically: $RESULT."
          fi
